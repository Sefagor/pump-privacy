<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diet plan · Pump</title>
<meta name="description" content="A diet plan shared from Pump. Open it in the app to follow it meal by meal.">
<meta name="theme-color" content="#0E0E0E">
<!-- Shared plans are unlisted: search engines must not index them. -->
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="/assets/img/favicon.png">
<meta property="og:title" content="A diet plan shared from Pump">
<meta property="og:description" content="Open it in Pump to follow it meal by meal.">
<meta property="og:image" content="https://pumphq.app/assets/img/share.jpg">
<meta name="twitter:card" content="summary_large_image">
<!--
  Diet plan preview (Sprint 42). Static: GitHub Pages can't route /p/<id>, so the id comes in the
  query (?id=…). The page reads that one plan straight from Firestore's REST API — public read by
  id, see firestore.rules — and renders it. Nothing else is loaded from other servers: the font is
  self-hosted like the rest of the site. "Open in Pump" uses an Android intent link that falls back
  to the Play Store with the plan id as install referrer, so the plan is waiting after install.
-->
<link rel="preload" href="/assets/fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face {
    font-family: "Manrope"; font-style: normal; font-weight: 200 800; font-display: swap;
    src: url(/assets/fonts/manrope-latin.woff2) format("woff2");
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
  @font-face {
    font-family: "Manrope"; font-style: normal; font-weight: 200 800; font-display: swap;
    src: url(/assets/fonts/manrope-latin-ext.woff2) format("woff2");
    unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
  }
  /* The app's own colours (ui/theme/Color.kt). */
  :root {
    color-scheme: dark;
    --bg: #0F0F0F; --surface: #1A1A1A; --input: #1E1E1E; --line: #2A2A2A;
    --text: #FFFFFF; --muted: #9A9A9A;
    --kcal: #FF8C42; --protein: #6C63FF; --carbs: #F5A623; --fat: #E57373;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: "Manrope", system-ui, sans-serif; line-height: 1.45; }
  main { max-width: 560px; margin: 0 auto; padding: 24px 16px 120px; display: grid; gap: 12px; }
  header.top { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
  header.top img { width: 28px; height: 28px; border-radius: 8px; }
  header.top a { color: var(--muted); text-decoration: none; font-weight: 700; letter-spacing: .02em; }
  .card { background: var(--surface); border-radius: 16px; overflow: hidden; }
  .card .strip { height: 4px; background: linear-gradient(90deg, var(--kcal), var(--carbs)); }
  .card .in { padding: 16px; display: grid; gap: 8px; }
  h1 { font-size: 1.45rem; margin: 0; line-height: 1.2; text-wrap: balance; }
  .muted { color: var(--muted); font-size: .9rem; }
  .avg { display: flex; align-items: center; gap: 12px; font-weight: 700; }
  .bar { flex: 1; height: 6px; border-radius: 3px; background: var(--input); display: flex; overflow: hidden; }
  .bar span:nth-child(1) { background: var(--protein); } .bar span:nth-child(2) { background: var(--carbs); } .bar span:nth-child(3) { background: var(--fat); }
  /* Grid children default to min-width:auto and would stretch the page to the chips' full width. */
  main > *, .card .in > * { min-width: 0; }
  .chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; font: inherit; font-size: .85rem; font-weight: 600; color: var(--text); background: var(--input);
          border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; cursor: pointer; }
  .chip[aria-pressed="true"] { background: #fff; color: #1A1A1A; border-color: #fff; }
  .chip:focus-visible { outline: 2px solid var(--kcal); outline-offset: 2px; }
  .meal h2 { font-size: 1rem; margin: 0; display: flex; justify-content: space-between; gap: 8px; }
  .meal h2 small { color: var(--muted); font-weight: 600; }
  .food { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-top: 1px solid #ffffff10; font-size: .95rem; }
  .food:first-child { border-top: 0; }
  .food span:last-child { color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .cta { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
         background: linear-gradient(180deg, #0F0F0F00, #0F0F0F 30%); }
  .cta a { display: block; max-width: 528px; margin: 0 auto; text-align: center; background: #fff; color: #1A1A1A;
           font-weight: 800; padding: 14px; border-radius: 12px; text-decoration: none; }
  .cta a:focus-visible { outline: 2px solid var(--kcal); outline-offset: 3px; }
  .state { text-align: center; padding: 48px 16px; color: var(--muted); }
  footer { text-align: center; font-size: .8rem; color: var(--muted); margin-top: 8px; }
  footer a { color: var(--muted); }
</style>
</head>
<body>
<main id="main">
  <header class="top"><img src="/assets/img/icon.png" alt=""><a href="/">Pump</a></header>
  <div class="state" id="state">…</div>
</main>
<div class="cta"><a id="cta" href="https://pumphq.app/">Open in Pump</a></div>
<script>
(function () {
  "use strict";
  var T = {
    en: { loading: "Loading the plan…", missing: "This plan isn't available any more. The link may have been removed.",
          error: "Couldn't load the plan. Check your connection and try again.", open: "Open in Pump",
          perDay: "kcal/day on average", day: "Day", choice: "Your choice", daily: "Every day", weekly: "Weekly", cycle: "{n}-day cycle",
          meals: { BREAKFAST: "Breakfast", LUNCH: "Lunch", DINNER: "Dinner", SNACK: "Snack", PRE_WORKOUT: "Pre-workout", POST_WORKOUT: "Post-workout" },
          footer: "Shared from Pump. Not medical advice.", report: "Report this plan" },
    tr: { loading: "Plan yükleniyor…", missing: "Bu plan artık mevcut değil. Bağlantı kaldırılmış olabilir.",
          error: "Plan yüklenemedi. Bağlantını kontrol edip tekrar dene.", open: "Pump'ta aç",
          perDay: "kcal/gün ortalama", day: "Gün", choice: "Senin seçimin", daily: "Her gün", weekly: "Haftalık", cycle: "{n} günlük döngü",
          meals: { BREAKFAST: "Kahvaltı", LUNCH: "Öğle yemeği", DINNER: "Akşam yemeği", SNACK: "Ara öğün", PRE_WORKOUT: "Antrenman öncesi", POST_WORKOUT: "Antrenman sonrası" },
          footer: "Pump'tan paylaşıldı. Tıbbi tavsiye değildir.", report: "Bu planı bildir" },
    de: { loading: "Plan wird geladen…", missing: "Dieser Plan ist nicht mehr verfügbar. Der Link wurde vielleicht entfernt.",
          error: "Plan konnte nicht geladen werden. Prüfe deine Verbindung und versuche es erneut.", open: "In Pump öffnen",
          perDay: "kcal/Tag im Schnitt", day: "Tag", choice: "Deine Wahl", daily: "Jeden Tag", weekly: "Wöchentlich", cycle: "{n}-Tage-Zyklus",
          meals: { BREAKFAST: "Frühstück", LUNCH: "Mittagessen", DINNER: "Abendessen", SNACK: "Snack", PRE_WORKOUT: "Vor dem Training", POST_WORKOUT: "Nach dem Training" },
          footer: "Geteilt aus Pump. Keine medizinische Beratung.", report: "Diesen Plan melden" },
    es: { loading: "Cargando el plan…", missing: "Este plan ya no está disponible. Puede que se haya quitado el enlace.",
          error: "No se pudo cargar el plan. Revisa tu conexión e inténtalo de nuevo.", open: "Abrir en Pump",
          perDay: "kcal/día de media", day: "Día", choice: "Tú eliges", daily: "Cada día", weekly: "Semanal", cycle: "Ciclo de {n} días",
          meals: { BREAKFAST: "Desayuno", LUNCH: "Almuerzo", DINNER: "Cena", SNACK: "Tentempié", PRE_WORKOUT: "Antes de entrenar", POST_WORKOUT: "Después de entrenar" },
          footer: "Compartido desde Pump. No es consejo médico.", report: "Denunciar este plan" },
    fr: { loading: "Chargement du plan…", missing: "Ce plan n'est plus disponible. Le lien a peut-être été retiré.",
          error: "Impossible de charger le plan. Vérifie ta connexion et réessaie.", open: "Ouvrir dans Pump",
          perDay: "kcal/jour en moyenne", day: "Jour", choice: "À ton choix", daily: "Chaque jour", weekly: "Hebdomadaire", cycle: "Cycle de {n} jours",
          meals: { BREAKFAST: "Petit-déjeuner", LUNCH: "Déjeuner", DINNER: "Dîner", SNACK: "Collation", PRE_WORKOUT: "Avant l'entraînement", POST_WORKOUT: "Après l'entraînement" },
          footer: "Partagé depuis Pump. Ne constitue pas un avis médical.", report: "Signaler ce plan" }
  };
  var lang = ((navigator.language || "en").slice(0, 2).toLowerCase());
  var t = T[lang] || T.en;
  document.documentElement.lang = T[lang] ? lang : "en";

  var main = document.getElementById("main");
  var state = document.getElementById("state");
  var cta = document.getElementById("cta");
  var id = new URLSearchParams(location.search).get("id") || "";
  cta.textContent = t.open;

  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

  if (!/^[A-Za-z0-9]{6,32}$/.test(id)) { state.textContent = t.missing; return; }

  // Android: open the app if installed, otherwise the Play Store with the plan as install referrer.
  var play = "https://play.google.com/store/apps/details?id=com.sefagor.pump&referrer=" + encodeURIComponent("plan=" + id);
  var isAndroid = /Android/i.test(navigator.userAgent);
  cta.href = isAndroid
    ? "intent://pumphq.app/p/?id=" + id + "#Intent;scheme=https;package=com.sefagor.pump;S.browser_fallback_url=" + encodeURIComponent(play) + ";end"
    : play;

  state.textContent = t.loading;
  fetch("https://firestore.googleapis.com/v1/projects/pump-51286/databases/(default)/documents/sharedPlans/" + id)
    .then(function (r) { if (r.status === 404 || r.status === 403) throw "missing"; if (!r.ok) throw "error"; return r.json(); })
    .then(function (doc) {
      var f = doc.fields || {};
      var name = (f.name && f.name.stringValue) || "";
      var plan = JSON.parse((f.content && f.content.stringValue) || "null");
      if (!plan || !name) throw "missing";
      render(name, plan);
    })
    .catch(function (e) { state.textContent = e === "missing" ? t.missing : t.error; });

  function optionTotals(o) {
    return (o.foods || []).reduce(function (a, f) {
      a.kcal += f.kcal || 0; a.p += f.protein || 0; a.c += f.carbs || 0; a.f += f.fat || 0; return a;
    }, { kcal: 0, p: 0, c: 0, f: 0 });
  }
  function mealFor(plan, day, type) {
    return (plan.meals || []).filter(function (m) { return m.day === day && m.meal === type; })[0];
  }
  function dayTotals(plan, day) {
    var s = { kcal: 0, p: 0, c: 0, f: 0 };
    (plan.mealTypes || []).forEach(function (type) {
      var m = mealFor(plan, day, type); if (!m) return;
      var opts = m.options || [];
      if (!opts.length) { s.kcal += m.kcalTarget || 0; return; }
      opts.forEach(function (o) { var t2 = optionTotals(o); s.kcal += t2.kcal / opts.length; s.p += t2.p / opts.length; s.c += t2.c / opts.length; s.f += t2.f / opts.length; });
    });
    return s;
  }

  function render(name, plan) {
    var days = Math.max(1, Math.min(28, plan.cycleDays || 1));
    state.remove();
    var avg = { kcal: 0, p: 0, c: 0, f: 0 };
    for (var d = 0; d < days; d++) { var s = dayTotals(plan, d); avg.kcal += s.kcal / days; avg.p += s.p / days; avg.c += s.c / days; avg.f += s.f / days; }

    var head = el("section", "card");
    head.appendChild(el("div", "strip"));
    var hin = el("div", "in");
    hin.appendChild(el("h1", null, name));
    var cyc = days === 1 ? t.daily : days === 7 ? t.weekly : t.cycle.replace("{n}", days);
    hin.appendChild(el("div", "muted", cyc + " · " + (plan.mealTypes || []).map(function (m) { return t.meals[m] || m; }).join(", ")));
    var row = el("div", "avg");
    row.appendChild(el("span", null, "~" + Math.round(avg.kcal) + " " + t.perDay));
    var bar = el("div", "bar");
    var energy = avg.p * 4 + avg.c * 4 + avg.f * 9 || 1;
    [avg.p * 4, avg.c * 4, avg.f * 9].forEach(function (v) { var s2 = el("span"); s2.style.width = (v / energy * 100) + "%"; bar.appendChild(s2); });
    row.appendChild(bar);
    hin.appendChild(row);
    head.appendChild(hin);
    main.appendChild(head);

    var dayChips = el("div", "chips");
    var mealsBox = el("div");
    mealsBox.style.display = "grid"; mealsBox.style.gap = "12px";
    if (days > 1) {
      for (var i = 0; i < days; i++) (function (i) {
        var b = el("button", "chip", t.day + " " + (i + 1));
        b.type = "button";
        b.setAttribute("aria-pressed", i === 0 ? "true" : "false");
        b.addEventListener("click", function () {
          Array.prototype.forEach.call(dayChips.children, function (c) { c.setAttribute("aria-pressed", "false"); });
          b.setAttribute("aria-pressed", "true");
          showDay(i);
        });
        dayChips.appendChild(b);
      })(i);
      main.appendChild(dayChips);
    }
    main.appendChild(mealsBox);

    function showDay(day) {
      mealsBox.textContent = "";
      (plan.mealTypes || []).forEach(function (type) {
        var m = mealFor(plan, day, type); if (!m) return;
        var card = el("section", "card meal");
        var inn = el("div", "in");
        var h = el("h2", null, t.meals[type] || type);
        var opts = m.options || [];
        if (!opts.length) {
          h.appendChild(el("small", null, m.kcalTarget ? "~" + m.kcalTarget + " kcal" : ""));
          inn.appendChild(h);
          inn.appendChild(el("div", "muted", t.choice));
        } else {
          var list = el("div");
          var showOpt = function (k) {
            list.textContent = "";
            (opts[k].foods || []).forEach(function (f) {
              var r = el("div", "food");
              r.appendChild(el("span", null, f.name + (f.grams > 0 ? " (" + Math.round(f.grams) + " g)" : "")));
              r.appendChild(el("span", null, (f.kcal || 0) + " kcal"));
              list.appendChild(r);
            });
          };
          h.appendChild(el("small", null, (opts.length > 1 ? "~" : "") + Math.round(opts.reduce(function (a, o) { return a + optionTotals(o).kcal; }, 0) / opts.length) + " kcal"));
          inn.appendChild(h);
          if (opts.length > 1) {
            var oc = el("div", "chips");
            opts.forEach(function (o, k) {
              var b = el("button", "chip", String.fromCharCode(65 + k) + "  " + optionTotals(o).kcal);
              b.type = "button";
              b.setAttribute("aria-pressed", k === 0 ? "true" : "false");
              b.addEventListener("click", function () {
                Array.prototype.forEach.call(oc.children, function (c) { c.setAttribute("aria-pressed", "false"); });
                b.setAttribute("aria-pressed", "true");
                showOpt(k);
              });
              oc.appendChild(b);
            });
            inn.appendChild(oc);
          }
          inn.appendChild(list);
          showOpt(0);
        }
        card.appendChild(inn);
        mealsBox.appendChild(card);
      });
    }
    showDay(0);

    var foot = el("footer");
    foot.appendChild(document.createTextNode(t.footer + " "));
    var rep = el("a", null, t.report);
    rep.href = "mailto:support@pumphq.app?subject=" + encodeURIComponent("Report shared plan " + id);
    foot.appendChild(rep);
    foot.appendChild(document.createTextNode(" · "));
    var terms = el("a", null, lang === "de" ? "AGB" : "Terms");
    terms.href = lang === "de" ? "/de/terms.html" : "/terms.html";
    foot.appendChild(terms);
    main.appendChild(foot);
  }
})();
</script>
</body>
</html>
